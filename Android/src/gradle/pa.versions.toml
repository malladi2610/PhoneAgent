# PhoneAgent-only dependencies. Kept separate from upstream's libs.versions.toml to avoid merge conflicts.
[versions]
okhttp = "4.12.0"
coroutines = "1.10.2"
junit = "4.13.2"
sherpaOnnx = "2.0.1"
# LiteRT (TFLite Interpreter API) runs the openWakeWord feature models in :pa-wakeword.
litert = "1.4.2"
# Unit tests only: runs the same feature models (ONNX copies) on the JVM for the parity test.
onnxruntimeJvm = "1.31.0"

[libraries]
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# sherpa-onnx static-link AAR, arm64-v8a only; served from pa-wakeword/localrepo (scripts/fetch-wakeword-assets.sh).
sherpa-onnx = { group = "com.k2fsa.sherpa.onnx", name = "sherpa-onnx-static-arm64", version.ref = "sherpaOnnx" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
onnxruntime-jvm = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntimeJvm" }
